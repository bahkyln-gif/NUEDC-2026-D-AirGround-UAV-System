<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Microsoft YaHei, sans-serif">
  <title>系统框图</title>
  <!-- 小车 -->
  <rect x="30" y="60" width="220" height="210" rx="12" fill="#e8f4fd" stroke="#1f6fb2" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-size="18" font-weight="bold">循线小车</text>
  <text x="45" y="118" font-size="12">· STM32F103C8T6 主控</text>
  <text x="45" y="140" font-size="12">· 8路灰度传感器循线 PID</text>
  <text x="45" y="162" font-size="12">· 编码器里程计+轨迹地图</text>
  <text x="45" y="184" font-size="12">· 2×直流减速电机 TB6612</text>
  <text x="45" y="206" font-size="12">· ESP32 WiFi UDP</text>
  <text x="45" y="228" font-size="12">· 一键启动按键</text>
  <text x="45" y="250" font-size="12">· 平台同心圆+十字图案</text>
  <!-- 无人机 -->
  <rect x="610" y="60" width="220" height="210" rx="12" fill="#eaf7ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="720" y="90" text-anchor="middle" font-size="18" font-weight="bold">多旋翼无人机</text>
  <text x="625" y="118" font-size="12">· 450轴距四旋翼 全防护桨</text>
  <text x="625" y="140" font-size="12">· Pixhawk4 (ArduPilot) 飞控</text>
  <text x="625" y="162" font-size="12">· 树莓派伴机 Python 状态机</text>
  <text x="625" y="184" font-size="12">· 下视摄像头 同心圆识别</text>
  <text x="625" y="206" font-size="12">· VL53L1X 激光定高辅助</text>
  <text x="625" y="228" font-size="12">· MG90S 舵机抛投机构</text>
  <text x="625" y="250" font-size="12">· MAVLink over UDP:14550</text>
  <!-- 地面站 -->
  <rect x="290" y="290" width="280" height="170" rx="12" fill="#fff7e6" stroke="#b26a00" stroke-width="2"/>
  <text x="430" y="318" text-anchor="middle" font-size="18" font-weight="bold">无线通信地面站（笔记本）</text>
  <text x="305" y="348" font-size="12">· Python + Tkinter 图形界面</text>
  <text x="305" y="370" font-size="12">· 场地 400×500 实时位置显示</text>
  <text x="305" y="392" font-size="12">· 无人机状态文字显示</text>
  <text x="305" y="414" font-size="12">· 数据落盘 CSV / 仿真模式</text>
  <text x="305" y="436" font-size="12">· UDP 端口 14551</text>
  <!-- 箭头：小车↔地面站 -->
  <line x1="250" y1="120" x2="292" y2="320" stroke="#555" stroke-width="2"/>
  <polygon points="290,312 292,322 281,318" fill="#555"/>
  <text x="240" y="215" font-size="11" fill="#555" transform="rotate(-65 240 215)">CAR_TELEMETRY 10Hz</text>
  <!-- 箭头：地面站↔无人机 -->
  <line x1="570" y1="320" x2="612" y2="120" stroke="#555" stroke-width="2"/>
  <polygon points="610,128 612,118 601,122" fill="#555"/>
  <text x="600" y="215" font-size="11" fill="#555" transform="rotate(-65 600 215)">UAV_TELEMETRY / 位置转发</text>
  <!-- 箭头：小车→无人机（启动指令） -->
  <path d="M 250 70 C 420 20, 440 20, 610 70" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="604,64 610,70 602,76" fill="#c62828"/>
  <text x="430" y="28" text-anchor="middle" font-size="12" fill="#c62828">UAV_START（一键启动无线指令）</text>
  <!-- 图例 -->
  <rect x="30" y="330" width="220" height="120" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="45" y="355" font-size="13" font-weight="bold">图例</text>
  <line x1="45" y1="378" x2="100" y2="378" stroke="#555" stroke-width="2"/>
  <text x="108" y="382" font-size="11">UDP/JSON 遥测与控制</text>
  <line x1="45" y1="405" x2="100" y2="405" stroke="#c62828" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="108" y="409" font-size="11">事件指令（启动/完成）</text>
</svg>
